name: CI
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: openuptime }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/openuptime
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.4, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm --filter @openuptime/web exec astro build
      - run: pnpm --filter @openuptime/web test
      - run: pnpm --filter @openuptime/mcp-rest test
      - run: pnpm --filter @openuptime/probe test
      # the migrations must apply to an empty database
      - run: pnpm db:migrate
      # schema drift: the schema in packages/db-pg/src must not need a migration that was not committed
      - name: Schema matches the committed migrations
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::pnpm db:generate produced a new migration: commit it (then run node scripts/gen-migrations.mjs)"
            git status --short
            exit 1
          fi
      - name: Embedded migrations match the generated SQL
        run: node scripts/gen-migrations.mjs --check
      - run: pnpm --filter @openuptime/db-pg test
      # the OAuth/MCP end-to-end test needs its own empty database (it applies the migrations itself)
      - run: PGPASSWORD=ci psql -h localhost -U ci -d openuptime -c 'create database openuptime_oauth_e2e'
      - run: pnpm --filter @openuptime/api test
        env:
          TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/openuptime_oauth_e2e
      - run: docker build -t openuptime:ci .
      - run: docker build -f apps/probe/Dockerfile -t openuptime-probe:ci .
