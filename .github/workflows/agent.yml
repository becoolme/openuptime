name: Server agent
on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # attaches binaries to the release of the tag it runs on: run it from a tag

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: apps/agent/go.mod }
      - name: Test
        working-directory: apps/agent
        run: go test ./...
      - name: Build
        working-directory: apps/agent
        env: { CGO_ENABLED: "0" }
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o dist/openuptime-agent-linux-$arch .
          done
          (cd dist && sha256sum openuptime-agent-linux-* > SHA256SUMS)
      # apps/agent/install.sh downloads from releases/latest, so every v* release carries the binaries
      - name: Attach to the release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" apps/agent/dist/* --clobber
